# swagger-multi 服务清单
#
# 一行一条：服务名=swagger v2 api-docs 地址
#   - 服务名随意取，Agent 靠它选服务；建议带上分组信息，如 `nursing-1-护理（住院）`
#   - 地址形如 http://<your-swagger-host>:<port>/<app>swagger/v2/api-docs?group=<group>
#   - `#` 开头是注释，空行忽略
#
# 改完跑：bash swagger-mcp-server/update_global_mcp.sh
# 下面几条是占位示例，按你团队的实际情况改或删：

# example-a=http://your-swagger-host:9080/aswagger/v2/api-docs?group=defaultGroup
# example-b=http://your-swagger-host:9080/bswagger/v2/api-docs?group=1-第一组
